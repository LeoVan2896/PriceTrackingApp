spring:
    application:
        name: app

    datasource:
        url: jdbc:postgresql://localhost:5432/app_db
        username: app_user
        password: app_pass
        driver-class-name: org.postgresql.Driver

    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        locations: classpath:db/migration


server:
    port: 8080
app:
    tracking:
        interval-ms: 1800000