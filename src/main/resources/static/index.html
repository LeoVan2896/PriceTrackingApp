<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Price Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<header>
    <h1>🎮 Game & Electronics Price Tracker</h1>
</header>

<main>

    <!-- Add Product -->
    <section class="card">
        <h2>Add Product</h2>
        <div class="form-group">
            <input type="text" id="productName" placeholder="Product name (e.g. PS5)" />
            <input type="text" id="productBrand" placeholder="Brand (e.g. Sony)" />
            <input type="text" id="productCategory" placeholder="Category (e.g. Console)" />
            <button onclick="createProduct()">Add Product</button>
        </div>
        <p id="productMsg" class="msg"></p>
    </section>

    <!-- Record Price -->
    <section class="card">
        <h2>Record a Price</h2>
        <div class="form-group">
            <input type="number" id="priceProductId" placeholder="Product ID" />
            <input type="text" id="storeName" placeholder="Store (e.g. Best Buy)" />
            <input type="number" id="priceValue" placeholder="Price (e.g. 499.99)" step="0.01" />
            <button onclick="addPrice()">Record Price</button>
        </div>
        <p id="priceMsg" class="msg"></p>
    </section>

    <!-- Product List -->
    <section class="card">
        <h2>All Products</h2>
        <button onclick="loadProducts()">Refresh List</button>
        <table id="productTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Category</th>
                <th>Tracking</th>
                <th>Added</th>
                <th>Lowest Price</th>
            </tr>
            </thead>
            <tbody id="productTableBody"></tbody>
        </table>
    </section>

    <!-- Price History -->
    <section class="card">
        <h2>Price History</h2>
        <div class="form-group">
            <input type="number" id="historyProductId" placeholder="Product ID" />
            <button onclick="loadPriceHistory()">Load History</button>
        </div>
        <table id="historyTable">
            <thead>
            <tr>
                <th>Store</th>
                <th>Price</th>
                <th>Recorded At</th>
            </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
        </table>
    </section>
    <!-- Price Chart -->
    <section class="card">
        <h2>Price History Chart</h2>
        <div class="form-group">
            <input type="number" id="chartProductId" placeholder="Product ID" />
            <button onclick="loadChart()">Show Chart</button>
        </div>
        <div id="chartContainer" style="display:none;">
            <h3 id="chartTitle" style="margin-bottom:1rem; font-size:1rem; color:#1a1a2e;"></h3>
            <canvas id="priceChart"></canvas>
        </div>
    </section>

</main>

<script src="app.js"></script>
</body>
</html>
